<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Dashboard | System Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hover-card:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        /* 커서 무빙 효과 배경 */
        #blob {
            position: fixed;
            width: 300px;
            height: 300px;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.15));
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6 overflow-hidden selection:bg-emerald-500/30">

    <div id="blob"></div>

    <main class="w-full max-w-2xl">
        <!-- Header -->
        <header class="mb-10 text-center">
            <span class="px-4 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold tracking-widest uppercase border border-emerald-500/20">System Operational</span>
            <h1 class="text-4xl md:text-6xl font-extrabold mt-6 mb-4 gradient-text">Deployment Status</h1>
            <p class="text-slate-400">최신 빌드 배포 현황 및 시스템 상태 리포트</p>
        </header>

        <!-- Main Card -->
        <section class="glass rounded-3xl p-6 md:p-10 shadow-2xl">
            <div class="flex items-center gap-4 mb-8">
                <div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <span class="text-white text-xl font-bold">V4</span>
                </div>
                <div>
                    <h2 class="text-xl font-semibold">src/main/resources/static/index.html</h2>
                    <p class="text-sm text-slate-500">배포 경로 최적화 완료</p>
                </div>
            </div>

            <!-- Version List -->
            <div class="space-y-3">
                <div class="version-row opacity-50 flex justify-between p-4 rounded-xl border border-white/5 hover:bg-white/5 transition-all">
                    <span>v1 - 최초 배포</span><span class="text-xs font-mono">0.1.0</span>
                </div>
                <div class="version-row opacity-60 flex justify-between p-4 rounded-xl border border-white/5 hover:bg-white/5 transition-all">
                    <span>v2 - 두번째 배포</span><span class="text-xs font-mono">0.1.2</span>
                </div>
                <div class="version-row opacity-70 flex justify-between p-4 rounded-xl border border-white/5 hover:bg-white/5 transition-all">
                    <span>v3 - 내맘대로 배포</span><span class="text-xs font-mono">0.2.0</span>
                </div>
                <div class="version-row bg-emerald-500/10 border border-emerald-500/30 flex justify-between p-4 rounded-xl animate-pulse">
                    <span class="text-emerald-300 font-bold">v4 - 자동화 완성~</span><span class="text-emerald-400 text-xs font-bold uppercase">Active</span>
                </div>
            </div>
        </section>

        <footer class="mt-8 text-center text-slate-600 text-sm">
            &copy; 2026 Engineering Lab. All rights reserved.
        </footer>
    </main>

    <script>
        // 마우스 커서 따라다니는 배경 효과
        const blob = document.getElementById("blob");
        document.body.onpointermove = event => {
            const { clientX, clientY } = event;
            blob.animate({
                left: `${clientX}px`,
                top: `${clientY}px`
            }, { duration: 3000, fill: "forwards" });
        }
    </script>
</body>
</html>
