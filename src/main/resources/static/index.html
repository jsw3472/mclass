<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot 테스트 페이지 - UX Redesign</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-emerald-500 selection:text-white">

    <!-- Background Ambient Glow Effects -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none animate-pulse-slow" style="animation-delay: 2s;"></div>

    <!-- Main Glassmorphism Card -->
    <div class="animate-float w-full max-w-lg bg-slate-900/70 backdrop-blur-2xl border border-slate-800/80 rounded-3xl p-8 md:p-10 shadow-2xl shadow-emerald-950/20 relative z-10">
        
        <!-- Status Indicator Badge -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold tracking-wide uppercase mb-6 shadow-inner">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            Deployment Success
        </div>

        <!-- Main Title -->
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-emerald-400 mb-4">
            Spring Boot 정적 파일 서빙 성공
        </h1>

        <!-- File Path Box -->
        <div class="bg-slate-950/60 border border-slate-800/60 rounded-xl p-3.5 mb-8 flex items-center gap-3 shadow-inner">
            <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <p class="text-xs md:text-sm text-slate-400 font-mono truncate">이 페이지는 src/main/resources/static/index.html 파일입니다.</p>
        </div>

        <!-- Version Evolution Timeline -->
        <div class="space-y-3">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Deployment Evolution</p>
            
            <!-- v1 -->
            <div class="group flex items-center justify-between p-3.5 rounded-xl bg-slate-950/30 border border-slate-800/40 hover:border-slate-700 transition-all duration-300">
                <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 font-mono text-xs font-bold">v1</span>
                    <span class="text-sm text-slate-300 font-medium">최초 배포</span>
                </div>
                <span class="text-xs text-slate-600">Initialized</span>
            </div>

            <!-- v2 -->
            <div class="group flex items-center justify-between p-3.5 rounded-xl bg-slate-950/30 border border-slate-800/40 hover:border-slate-700 transition-all duration-300">
                <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 font-mono text-xs font-bold">v2</span>
                    <span class="text-sm text-slate-300 font-medium">두번째 배포</span>
                </div>
                <span class="text-xs text-slate-600">Updated</span>
            </div>

            <!-- v3 -->
            <div class="group flex items-center justify-between p-3.5 rounded-xl bg-slate-950/30 border border-slate-800/40 hover:border-slate-700 transition-all duration-300">
                <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 font-mono text-xs font-bold">v3</span>
                    <span class="text-sm text-slate-300 font-medium">내맘대로 배포</span>
                </div>
                <span class="text-xs text-slate-600">Customized</span>
            </div>

            <!-- v4 (Highlighted / Automation Complete) -->
            <div class="group flex items-center justify-between p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 shadow-lg shadow-emerald-950/50 transition-all duration-300">
                <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded-md bg-emerald-500 text-slate-950 font-mono text-xs font-extrabold">v4</span>
                    <span class="text-sm text-emerald-300 font-semibold">자동화 완성~</span>
                </div>
                <span class="inline-flex items-center gap-1.5 text-xs text-emerald-400 font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Completed
                </span>
            </div>

        </div>

        <!-- Card Footer -->
        <div class="mt-8 pt-6 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500">
            <span>Spring Boot Static Engine</span>
            <span class="flex items-center gap-1.5 text-emerald-400 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live Status
            </span>
        </div>

    </div>

</body>
</html>
