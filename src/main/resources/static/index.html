<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEPLOYMENT CORE // OVERDRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 500: '#00ffcc', 600: '#ff0055', dark: '#030712' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700;800&family=Noto+Sans+KR:wght@300;500;900&display=swap');
        
        body { font-family: 'JetBrains Mono', 'Noto Sans KR', monospace; }
        
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch::before {
            left: 2px; text-shadow: -2px 0 #ff0055; clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -2px 0 #00ffcc; clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            20% { clip: rect(11px, 9999px, 56px, 0); }
            40% { clip: rect(78px, 9999px, 12px, 0); }
            60% { clip: rect(45px, 9999px, 89px, 0); }
            80% { clip: rect(12px, 9999px, 67px, 0); }
            100% { clip: rect(90px, 9999px, 33px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(76px, 9999px, 12px, 0); }
            20% { clip: rect(34px, 9999px, 89px, 0); }
            40% { clip: rect(12px, 9999px, 45px, 0); }
            60% { clip: rect(89px, 9999px, 23px, 0); }
            80% { clip: rect(54px, 9999px, 78px, 0); }
            100% { clip: rect(2px, 9999px, 99px, 0); }
        }
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
        }
    </style>
</head>
<body class="bg-cyber-dark text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8 overflow-x-hidden scanlines selection:bg-cyber-500 selection:text-black">

    <!-- Three.js 3D 파티클 백그라운드 캔버스 -->
    <div id="canvas-container"></div>

    <!-- 상단 네비게이션 메타 정보 -->
    <header class="w-full max-w-5xl mx-auto flex justify-between items-center border-b border-cyber-500/30 pb-4 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-cyber-500 rounded-full animate-ping"></div>
            <span class="text-xs tracking-widest text-cyber-500 font-bold uppercase">SYS_CORE // v4.0.26</span>
        </div>
        <div id="live-clock" class="text-xs text-slate-400 font-mono"></div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-3xl mx-auto my-auto py-10">
        
        <!-- 타이틀 카드 -->
        <div class="relative group mb-8">
            <div class="absolute -inset-1 bg-gradient-to-r from-cyber-600 to-cyber-500 rounded-2xl blur-xl opacity-30 group-hover:opacity-60 transition duration-1000"></div>
            
            <div class="relative bg-slate-900/80 border border-cyber-500/40 backdrop-blur-2xl rounded-2xl p-6 md:p-10 shadow-2xl">
                
                <!-- 서빙 성공 배지 -->
                <div class="inline-block px-3 py-1 mb-4 rounded bg-cyber-500/10 border border-cyber-500/50 text-cyber-500 text-xs font-extrabold tracking-widest uppercase">
                    [ STATUS: PROTOCOL_ACTIVE ]
                </div>

                <h1 class="text-2xl md:text-5xl font-black tracking-tighter mb-4 glitch" data-text="Spring Boot 정적 파일 서빙 성공">
                    Spring Boot 정적 파일 서빙 성공
                </h1>

                <!-- 파일 경로 박스 (클릭 시 복사 인터랙션 추가) -->
                <div onclick="copyPath()" class="group/path cursor-pointer bg-black/60 border border-slate-700/80 rounded-lg p-4 flex items-center justify-between hover:border-cyber-500 transition-all duration-300">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-cyber-500 shrink-0 font-bold">></span>
                        <p class="text-xs md:text-sm text-slate-300 font-mono truncate">src/main/resources/static/index.html</p>
                    </div>
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-1 rounded shrink-0 group-hover/path:bg-cyber-500 group-hover/path:text-black font-bold transition-all">COPY PATH</span>
                </div>
            </div>
        </div>

        <!-- 배포 히스토리 타임라인 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- v1 -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between opacity-40 hover:opacity-100 transition-all">
                <div class="flex items-center gap-3">
                    <span class="font-mono text-xs font-bold text-slate-500">v1</span>
                    <span class="text-sm font-medium">최초 배포</span>
                </div>
                <span class="text-[10px] text-slate-600 font-mono">INITIAL</span>
            </div>

            <!-- v2 -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between opacity-50 hover:opacity-100 transition-all">
                <div class="flex items-center gap-3">
                    <span class="font-mono text-xs font-bold text-slate-400">v2</span>
                    <span class="text-sm font-medium">두번째 배포</span>
                </div>
                <span class="text-[10px] text-slate-600 font-mono">PATCH_01</span>
            </div>

            <!-- v3 -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between opacity-70 hover:opacity-100 transition-all">
                <div class="flex items-center gap-3">
                    <span class="font-mono text-xs font-bold text-cyber-600">v3</span>
                    <span class="text-sm font-medium">내맘대로 배포</span>
                </div>
                <span class="text-[10px] text-slate-500 font-mono">OVERRIDE</span>
            </div>

            <!-- v4 (극한의 강조) -->
            <div class="relative group overflow-hidden bg-gradient-to-br from-cyber-500/20 to-slate-900 border-2 border-cyber-500 rounded-xl p-4 flex items-center justify-between shadow-lg shadow-cyber-500/20">
                <div class="absolute -right-10 -bottom-10 w-24 h-24 bg-cyber-500/20 rounded-full blur-xl group-hover:scale-150 transition-all duration-500"></div>
                <div class="flex items-center gap-3 relative z-10">
                    <span class="font-mono text-xs font-extrabold bg-cyber-500 text-black px-1.5 py-0.5 rounded">v4</span>
                    <span class="text-sm font-bold text-cyber-500">자동화 완성~</span>
                </div>
                <span class="text-[10px] bg-cyber-500/20 text-cyber-500 px-2 py-1 rounded font-bold font-mono tracking-wider animate-pulse relative z-10">OPTIMIZED</span>
            </div>

        </div>

    </main>

    <!-- 하단 푸터 -->
    <footer class="w-full max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center text-xs text-slate-500 border-t border-slate-800 pt-4 gap-2">
        <p>ENGINEERED FOR EXTREME PERFORMANCE.</p>
        <p class="text-cyber-500/70 font-mono">SECURE_CONNECTION // 2026</p>
    </footer>

    <!-- 자바스크립트 인터랙션 (Three.js 3D 입자 + 시계 + 복사 기능) -->
    <script>
        // 실시간 시계
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0] + '.' + Math.floor(now.getMilliseconds()/10);
        }, 50);

        // 경로 복사 기능
        function copyPath() {
            navigator.clipboard.writeText("src/main/resources/static/index.html");
            alert("파일 경로가 클립보드에 복사되었습니다.");
        }

        // Three.js 3D 배경 입자 효과
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.015,
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 3;

        // 마우스 인터랙션 좌표
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        // 애니메이션 루프
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particlesMesh.rotation.y = elapsedTime * 0.05 + mouseX * 0.5;
            particlesMesh.rotation.x = elapsedTime * 0.03 + mouseY * 0.5;

            renderer.render(scene, camera);
        }

        animate();

        // 반응형 리사이즈 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
