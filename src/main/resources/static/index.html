<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Production Core // Telemetry Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050507;
            color: #ededef;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* 오로라 메시 그라데이션 애니메이션 배경 */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.5;
            pointer-events: none;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            will-change: transform;
            animation: float-blob 20s infinite alternate cubic-bezier(0.37, 0, 0.63, 1);
        }
        .blob-1 { width: 500px; height: 500px; background: rgba(14, 165, 233, 0.15); top: -10%; left: 10%; }
        .blob-2 { width: 600px; height: 600px; background: rgba(16, 185, 129, 0.12); bottom: -20%; right: 5%; animation-delay: -5s; }
        .blob-3 { width: 400px; height: 400px; background: rgba(99, 102, 241, 0.12); top: 40%; left: 30%; animation-delay: -10s; }

        @keyframes float-blob {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(50px, -80px) scale(1.1); }
            100% { transform: translate(-40px, 60px) scale(0.9); }
        }

        /* 3D 틸트 카드 기본 스타일 */
        .tilt-card {
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: transform 0.1s ease-out;
        }

        /* 글래스모피즘 + 반사 광원 효과 */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* 마우스 추적형 라이트 스페큘러 */
        .spotlight {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.06), transparent 40%);
            z-index: 2;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 selection:bg-emerald-500 selection:text-black">

    <!-- 배경 오로라 메시 -->
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-xl">
        
        <!-- 실시간 텔레메트리 바 (위치, 날씨, 초단위 시계) -->
        <div class="mb-4 grid grid-cols-2 md:grid-cols-3 gap-2.5 text-xs">
            <!-- 시계 -->
            <div class="glass-panel rounded-xl px-4 py-3 flex items-center gap-2.5">
                <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="live-time" class="mono text-slate-300 font-bold">00:00:00</span>
            </div>

            <!-- 위치 -->
            <div class="glass-panel rounded-xl px-4 py-3 flex items-center gap-2.5 truncate">
                <svg class="w-4 h-4 text-sky-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span id="location-text" class="text-slate-300 font-medium truncate">위치 확인중...</span>
            </div>

            <!-- 날씨 -->
            <div class="glass-panel rounded-xl px-4 py-3 col-span-2 md:col-span-1 flex items-center gap-2.5">
                <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                </svg>
                <span id="weather-text" class="text-slate-300 font-medium truncate">날씨 로딩중...</span>
            </div>
        </div>

        <!-- 3D 인터랙티브 카드 -->
        <div id="card" class="tilt-card glass-panel rounded-3xl p-8 md:p-10 relative overflow-hidden">
            <div class="spotlight"></div>

            <!-- 상단 뱃지 -->
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold tracking-wider uppercase mb-6 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                Production Live
            </div>

            <!-- 타이틀 -->
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-4 leading-tight">
                Spring Boot 정적 파일 서빙 성공
            </h1>

            <!-- 파일 경로 바 -->
            <div class="bg-black/40 border border-white/5 rounded-xl p-4 mb-8 flex items-center gap-3 backdrop-blur-md">
                <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <p class="text-xs md:text-sm text-slate-300 mono truncate">src/main/resources/static/index.html</p>
            </div>

            <!-- 배포 버전 히스토리 타임라인 -->
            <div class="space-y-3">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-3">Deployment Ledger</div>
                
                <!-- v1 -->
                <div class="flex items-center justify-between p-3.5 rounded-xl bg-white/[0.02] border border-white/5 hover:border-white/15 transition-all duration-300 opacity-40 hover:opacity-100">
                    <div class="flex items-center gap-3">
                        <span class="mono px-2 py-0.5 rounded bg-white/10 text-slate-300 text-xs font-bold">v1</span>
                        <span class="text-sm font-medium">최초 배포</span>
                    </div>
                    <span class="text-xs text-slate-500 mono">INITIAL</span>
                </div>

                <!-- v2 -->
                <div class="flex items-center justify-between p-3.5 rounded-xl bg-white/[0.02] border border-white/5 hover:border-white/15 transition-all duration-300 opacity-60 hover:opacity-100">
                    <div class="flex items-center gap-3">
                        <span class="mono px-2 py-0.5 rounded bg-white/10 text-slate-300 text-xs font-bold">v2</span>
                        <span class="text-sm font-medium">두번째 배포</span>
                    </div>
                    <span class="text-xs text-slate-500 mono">SYNCED</span>
                </div>

                <!-- v3 -->
                <div class="flex items-center justify-between p-3.5 rounded-xl bg-white/[0.02] border border-white/5 hover:border-white/15 transition-all duration-300 opacity-80 hover:opacity-100">
                    <div class="flex items-center gap-3">
                        <span class="mono px-2 py-0.5 rounded bg-white/10 text-slate-300 text-xs font-bold">v3</span>
                        <span class="text-sm font-medium">내맘대로 배포</span>
                    </div>
                    <span class="text-xs text-slate-500 mono">MODIFIED</span>
                </div>

                <!-- v4 (하이라이트) -->
                <div class="relative overflow-hidden flex items-center justify-between p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 shadow-lg shadow-emerald-500/10">
                    <div class="absolute inset-0 bg-gradient-to-r from-emerald-500/10 to-transparent pointer-events-none"></div>
                    <div class="flex items-center gap-3 relative z-10">
                        <span class="mono px-2.5 py-0.5 rounded bg-emerald-500 text-black text-xs font-extrabold">v4</span>
                        <span class="text-sm font-bold text-emerald-300">자동화 완성~</span>
                    </div>
                    <span class="text-xs text-emerald-400 mono font-bold uppercase tracking-wider relative z-10 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> STABLE
                    </span>
                </div>

            </div>

            <!-- 카드 푸터 -->
            <div class="mt-8 pt-6 border-t border-white/5 flex items-center justify-between text-xs text-slate-500">
                <span class="mono">SYSTEM // SPRING-BOOT-STATIC</span>
                <span class="text-emerald-400/80 font-medium">2026.08 BUILD</span>
            </div>

        </div>

    </main>

    <!-- 인터랙션 및 텔레메트리 자바스크립트 -->
    <script>
        // 1. 실시간 시계 (초 단위 갱신)
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 날씨 및 위치 데이터 처리 함수
        async function fetchWeatherAndLocation(lat, lon, cityNameOverride = null) {
            try {
                if (!cityNameOverride) {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ko`);
                    const geoData = await geoRes.json();
                    const address = geoData.address;
                    const city = address.city || address.town || address.county || address.borough || "현재 위치";
                    document.getElementById('location-text').innerText = city;
                } else {
                    document.getElementById('location-text').innerText = cityNameOverride;
                }

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherRes.json();
                const temp = weatherData.current_weather.temperature;
                const code = weatherData.current_weather.weathercode;
                
                let weatherDesc = "맑음";
                if (code > 0 && code < 4) weatherDesc = "구름 많음";
                else if (code >= 45 && code < 50) weatherDesc = "안개";
                else if (code >= 50 && code < 70) weatherDesc = "비";
                else if (code >= 70 && code < 80) weatherDesc = "눈";
                else if (code >= 80) weatherDesc = "소나기";

                document.getElementById('weather-text').innerText = `${weatherDesc} (${temp}°C)`;
            } catch (e) {
                document.getElementById('weather-text').innerText = "날씨 정보 로드 실패";
            }
        }

        // 3. 위치 권한 허용 실패/차단 시 IP 기반 자동 위치 추적 폴백(Fallback) 적용
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    fetchWeatherAndLocation(position.coords.latitude, position.coords.longitude);
                },
                async () => {
                    // 브라우저 위치 권한 차단 시 IP 기반 위치 자동 파악
                    try {
                        const ipRes = await fetch('https://ipwho.is/');
                        const ipData = await ipRes.json();
                        if (ipData.success) {
                            fetchWeatherAndLocation(ipData.latitude, ipData.longitude, ipData.city);
                        } else {
                            throw new Error();
                        }
                    } catch (err) {
                        document.getElementById('location-text').innerText = "위치 확인 불가";
                        document.getElementById('weather-text').innerText = "날씨 조회 불가";
                    }
                }
            );
        } else {
            document.getElementById('location-text').innerText = "위치 미지원 브라우저";
            document.getElementById('weather-text').innerText = "조회 불가";
        }

        // 4. 3D 틸트 카드 마우스 인터랙션
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -6;
            const rotateY = ((x - centerX) / centerX) * 6;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        });
    </script>
</body>
</html>
